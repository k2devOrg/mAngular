<section class="bg-gray-50" data-testid="shop-toolbar">
  <!-- Mobile filter dialog -->
  <div data-testid="mobile-filters-root">
    <dialog id="mobile-filters" class="overflow-hidden backdrop:bg-transparent sm:hidden" data-testid="mobile-filters-dialog">
      <div class="fixed inset-0 bg-black/25" data-testid="mobile-filters-backdrop"></div>

      <div tabindex="0" class="fixed inset-0 flex focus:outline-none">
        <div class="relative ml-auto flex size-full max-w-xs flex-col overflow-y-auto bg-white pt-4 pb-6 shadow-xl">
          <div class="mr-4 flex items-center justify-between px-4">
            <h2 class="text-lg font-medium text-gray-900" data-testid="mobile-filters-heading">Filtry</h2>
            <button
              type="button"
              command="close"
              commandfor="mobile-filters"
              class="relative -mr-2 flex size-10 items-center justify-center rounded-md bg-white p-2 text-gray-400 hover:bg-gray-50"
              data-testid="mobile-filters-close"
            >
              <span class="sr-only">Zamknij filtry</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <form class="mt-4 mr-4" data-testid="mobile-filters-form">
            <div class="border-t border-gray-200 px-4 py-6" data-testid="mobile-category-filters">
              <h3 class="text-sm font-medium text-gray-900">Gra / Kategoria</h3>

              <div class="space-y-4 pt-4">
                <div class="flex gap-3">
                  <input
                    id="filter-mobile-category-0"
                    type="radio"
                    name="mobile-category"
                    [checked]="selectedCategory === ''"
                    (change)="selectCategory('')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="mobile-category-all"
                  />
                  <label for="filter-mobile-category-0" class="text-sm text-gray-500">Wszystkie</label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-mobile-category-1"
                    type="radio"
                    name="mobile-category"
                    [checked]="selectedCategory === 'pokemon'"
                    (change)="selectCategory('pokemon')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="mobile-category-pokemon"
                  />
                  <label for="filter-mobile-category-1" class="text-sm text-gray-500">Pokémon</label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-mobile-category-2"
                    type="radio"
                    name="mobile-category"
                    [checked]="selectedCategory === 'magic-the-gathering'"
                    (change)="selectCategory('magic-the-gathering')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="mobile-category-mtg"
                  />
                  <label for="filter-mobile-category-2" class="text-sm text-gray-500">Magic: The Gathering</label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-mobile-category-3"
                    type="radio"
                    name="mobile-category"
                    [checked]="selectedCategory === 'yu-gi-oh'"
                    (change)="selectCategory('yu-gi-oh')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="mobile-category-yugioh"
                  />
                  <label for="filter-mobile-category-3" class="text-sm text-gray-500">Yu-Gi-Oh!</label>
                </div>
              </div>
            </div>

            <div class="border-t border-gray-200 px-4 py-6" data-testid="mobile-price-filters">
              <h3 class="text-sm font-medium text-gray-900">Cena</h3>

              <div class="grid grid-cols-2 gap-4 pt-4">
                <div>
                  <label for="mobile-min-price" class="block text-sm font-medium text-gray-700">Cena od</label>
                  <input
                    id="mobile-min-price"
                    type="number"
                    min="0"
                    placeholder="0"
                    [(ngModel)]="minPrice"
                    name="mobileMinPrice"
                    class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-black focus:outline-none focus:ring-0"
                    data-testid="mobile-min-price"
                  />
                </div>

                <div>
                  <label for="mobile-max-price" class="block text-sm font-medium text-gray-700">Cena do</label>
                  <input
                    id="mobile-max-price"
                    type="number"
                    min="0"
                    placeholder="1000"
                    [(ngModel)]="maxPrice"
                    name="mobileMaxPrice"
                    class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-black focus:outline-none focus:ring-0"
                    data-testid="mobile-max-price"
                  />
                </div>
              </div>
            </div>

            <div class="border-t border-gray-200 px-4 py-6 space-y-3">
              <button
                type="button"
                (click)="applyPriceFilters()"
                class="w-full rounded-md bg-black px-4 py-3 text-sm font-medium text-white hover:bg-gray-900"
                data-testid="mobile-apply-filters"
              >
                Zastosuj filtry
              </button>

              <button
                type="button"
                (click)="clearFilters()"
                class="w-full rounded-md border border-gray-300 px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50"
                data-testid="mobile-clear-filters"
              >
                Wyczyść filtry
              </button>
            </div>
          </form>
        </div>
      </div>
    </dialog>
  </div>

  <div class="mx-auto max-w-7xl px-4 py-5 md:px-6 md:py-5">
    <section aria-labelledby="filter-heading" class="border-b py-6" data-testid="filters-bar">
      <h2 id="filter-heading" class="sr-only">Filtry produktów</h2>

      <div class="flex items-center justify-between">
        <!-- Sort -->
        <div class="relative inline-block text-left" data-testid="sort-dropdown">
          <button
            type="button"
            (click)="toggleSort()"
            class="group ml-6 inline-flex items-center justify-center text-sm font-medium text-gray-700 hover:text-gray-900"
            data-testid="sort-toggle"
          >
            {{ selectedSortLabel }}
            <svg
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
              class="-mr-1 ml-1 size-5 shrink-0 text-gray-400 transition group-hover:text-gray-500"
              [class.rotate-180]="sortOpen"
            >
              <path
                d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
                fill-rule="evenodd"
              />
            </svg>
          </button>

          @if (sortOpen) {
          <div
            class="absolute left-0 z-50 mt-2 w-48 rounded-md bg-white shadow-2xl ring-1 ring-black/5"
            data-testid="sort-menu"
          >
            <div class="py-1">
              <button
                type="button"
                (click)="selectSort('Nazwa A-Z', 'name,asc')"
                class="block w-full px-4 py-2 text-left text-sm font-medium text-gray-900 hover:bg-gray-100"
                data-testid="sort-option-name-asc"
              >
                Nazwa A-Z
              </button>

              <button
                type="button"
                (click)="selectSort('Cena rosnąco', 'price,asc')"
                class="block w-full px-4 py-2 text-left text-sm font-medium text-gray-900 hover:bg-gray-100"
                data-testid="sort-option-price-asc"
              >
                Cena rosnąco
              </button>

              <button
                type="button"
                (click)="selectSort('Cena malejąco', 'price,desc')"
                class="block w-full px-4 py-2 text-left text-sm font-medium text-gray-900 hover:bg-gray-100"
                data-testid="sort-option-price-desc"
              >
                Cena malejąco
              </button>
            </div>
          </div>
          }
        </div>

        <!-- Mobile button -->
        <button
          type="button"
          command="show-modal"
          commandfor="mobile-filters"
          class="mr-6 inline-block text-sm font-medium text-gray-700 hover:text-gray-900 sm:hidden"
          data-testid="open-mobile-filters"
        >
          Filtry
        </button>

        <!-- Desktop filters -->
        <div class="hidden sm:flex sm:items-baseline sm:space-x-8">
          <!-- Category -->
          <div class="relative inline-block text-left" data-testid="desktop-category-dropdown">
            <button
              type="button"
              (click)="toggleCategory()"
              class="group inline-flex items-center justify-center text-sm font-medium text-gray-700 hover:text-gray-900"
              data-testid="desktop-category-toggle"
            >
              <span>Gra</span>
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
                class="-mr-1 ml-1 size-5 shrink-0 text-gray-400 transition group-hover:text-gray-500"
                [class.rotate-180]="categoryOpen"
              >
                <path
                  d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                  clip-rule="evenodd"
                  fill-rule="evenodd"
                />
              </svg>
            </button>

            @if (categoryOpen) {
            <div
              class="absolute right-0 z-50 mt-2 min-w-56 rounded-md bg-white p-4 shadow-2xl ring-1 ring-black/5"
              data-testid="desktop-category-menu"
            >
              <form class="space-y-4">
                <div class="flex gap-3">
                  <input
                    id="filter-category-0"
                    type="radio"
                    name="desktop-category"
                    [checked]="selectedCategory === ''"
                    (change)="selectCategory('')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="desktop-category-all"
                  />
                  <label for="filter-category-0" class="pr-6 text-sm font-medium whitespace-nowrap text-gray-900">
                    Wszystkie
                  </label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-category-1"
                    type="radio"
                    name="desktop-category"
                    [checked]="selectedCategory === 'pokemon'"
                    (change)="selectCategory('pokemon')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="desktop-category-pokemon"
                  />
                  <label for="filter-category-1" class="pr-6 text-sm font-medium whitespace-nowrap text-gray-900">
                    Pokémon
                  </label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-category-2"
                    type="radio"
                    name="desktop-category"
                    [checked]="selectedCategory === 'magic-the-gathering'"
                    (change)="selectCategory('magic-the-gathering')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="desktop-category-mtg"
                  />
                  <label for="filter-category-2" class="pr-6 text-sm font-medium whitespace-nowrap text-gray-900">
                    Magic: The Gathering
                  </label>
                </div>

                <div class="flex gap-3">
                  <input
                    id="filter-category-3"
                    type="radio"
                    name="desktop-category"
                    [checked]="selectedCategory === 'yu-gi-oh'"
                    (change)="selectCategory('yu-gi-oh')"
                    class="mt-0.5 size-4 border-gray-300 text-black focus:ring-0"
                    data-testid="desktop-category-yugioh"
                  />
                  <label for="filter-category-3" class="pr-6 text-sm font-medium whitespace-nowrap text-gray-900">
                    Yu-Gi-Oh!
                  </label>
                </div>
              </form>
            </div>
            }
          </div>

          <!-- Price -->
          <div class="relative inline-block text-left" data-testid="desktop-price-dropdown">
            <button
              type="button"
              (click)="togglePrice()"
              class="group inline-flex items-center justify-center text-sm font-medium text-gray-700 hover:text-gray-900"
              data-testid="desktop-price-toggle"
            >
              <span>Cena</span>
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
                class="-mr-1 ml-1 size-5 shrink-0 text-gray-400 transition group-hover:text-gray-500"
                [class.rotate-180]="priceOpen"
              >
                <path
                  d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                  clip-rule="evenodd"
                  fill-rule="evenodd"
                />
              </svg>
            </button>

            @if (priceOpen) {
            <div
              class="absolute right-0 z-50 mt-2 min-w-64 rounded-md bg-white p-4 shadow-2xl ring-1 ring-black/5"
              data-testid="desktop-price-menu"
            >
              <form class="space-y-4">
                <div>
                  <label for="desktop-min-price" class="block text-sm font-medium text-gray-700">
                    Cena od
                  </label>
                  <input
                    id="desktop-min-price"
                    type="number"
                    min="0"
                    placeholder="0"
                    [(ngModel)]="minPrice"
                    name="desktopMinPrice"
                    class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-black focus:outline-none focus:ring-0"
                    data-testid="desktop-min-price"
                  />
                </div>

                <div>
                  <label for="desktop-max-price" class="block text-sm font-medium text-gray-700">
                    Cena do
                  </label>
                  <input
                    id="desktop-max-price"
                    type="number"
                    min="0"
                    placeholder="1000"
                    [(ngModel)]="maxPrice"
                    name="desktopMaxPrice"
                    class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-black focus:outline-none focus:ring-0"
                    data-testid="desktop-max-price"
                  />
                </div>

                <button
                  type="button"
                  (click)="applyPriceFilters()"
                  class="w-full rounded-md bg-black px-4 py-2 text-sm font-medium text-white hover:bg-gray-900"
                  data-testid="desktop-apply-price-filters"
                >
                  Zastosuj
                </button>
              </form>
            </div>
            }
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
