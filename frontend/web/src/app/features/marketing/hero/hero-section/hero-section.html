<section
  class="relative bg-cover bg-center min-h-[65vh]"
  style="background-image: url('/assets/hero-image.png');"
  data-testid="hero-section"
>
  <div class="absolute inset-0 bg-gradient-to-b from-black/75 to-black/30 backdrop-blur-[0.75px]"></div>

  <div
    class="relative grid grid-cols-1 text-center md:text-left mx-auto gap-6 px-4 max-w-prose md:max-w-7xl py-20 md:py-24"
  >
    <h1 class="text-2xl md:text-5xl text-white" data-testid="hero-heading">
      Nowa kolekcja kart
    </h1>

    <p class="text-white/90" data-testid="hero-subtitle">
      Odkryj karty kolekcjonerskie
    </p>

    <button
      routerLink="/shop"
      class="justify-self-center md:justify-self-start bg-white text-black px-6 py-3 font-semibold rounded"
      data-testid="hero-cta-button"
    >
      Przejdź do sklepu
    </button>
  </div>
</section>
